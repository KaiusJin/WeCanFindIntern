[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecanfindintern"
version = "1.1.0"
description = "High-throughput job collection and data API for WeCanFindIntern"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1.0",
  "faster-whisper>=1.0",
  "fpdf2>=2.8",
  "google-generativeai>=0.8",
  "gTTS>=2.5",
  "httpx>=0.27,<1.0",
  "openai>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pypdf>=6.0",
  "python-docx>=1.2",
  # Cloud collection installs its own requirements separately.
  "python-multipart>=0.0.20",
  "uvicorn>=0.35,<1.0",
  "websockets>=13,<16",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*", "tests/**/*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["src/wecanfindintern", "cloud", "scripts", "tests"]
pythonpath = [".", "src"]
markers = [
  "db: integration tests requiring a live PostgreSQL database (deselected by default in CI unit step)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# Code derived from JobSpy keeps its upstream style (see cloud/sources/jobspy/LICENSE).
extend-exclude = [
  "cloud/sources/jobspy/linkedin",
  "cloud/sources/jobspy/indeed",
  "cloud/sources/jobspy/shared",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
