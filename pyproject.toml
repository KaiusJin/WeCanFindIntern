[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecanfindintern"
version = "0.1.0"
description = "High-throughput job collection and data API for WeCanFindIntern"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1.0",
  "faster-whisper>=1.0",
  "fpdf2>=2.8",
  "google-generativeai>=0.8",
  "gTTS>=2.5",
  "httpx>=0.27,<1.0",
  "openai>=2.0,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pypdf>=6.0",
  "python-docx>=1.2",
  # JobSpy is installed from vendor/JobSpy via requirements.txt (-e ./vendor/JobSpy).
  "python-multipart>=0.0.20",
  "uvicorn>=0.35,<1.0",
  "websockets>=13,<16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "db: integration tests requiring a live PostgreSQL database (deselected by default in CI unit step)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
