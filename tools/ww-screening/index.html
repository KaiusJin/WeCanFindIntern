<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaterlooWorks 匹配名单</title><link rel="stylesheet" href="/screening.css"></head><body><main>
<h1>WaterlooWorks 匹配名单</h1><p>寻找 Data Engineering、Web 开发、前端开发、软件 QA 与测试岗位。只输出 JD 明确匹配的 Job ID。</p>
<section><label>岗位文件<input id="file" type="file" accept=".json,.csv"></label><p id="file-status">选择桌面的 JSON 或 CSV 文件，任选一个。</p><label>DeepSeek API Key<input id="key" type="password" autocomplete="off" placeholder="sk-…"></label><label>并发数<input id="concurrency" type="number" min="1" max="15" value="15"></label><p class="muted">使用 DeepSeek V4 Flash。开始后 JD 会发送到 DeepSeek 并产生 API 用量；Key 不保存。</p><div class="actions"><button id="start" disabled>开始筛选</button><button id="stop" class="secondary" disabled>暂停</button></div><p id="status" role="status">等待导入</p><progress id="progress" value="0" max="1"></progress></section>
<section><div class="actions"><h2>匹配 Job ID</h2><button id="copy" class="secondary" disabled>复制</button><button id="download" class="secondary" disabled>下载 TXT</button></div><textarea id="ids" rows="12" readonly placeholder="筛选后这里只显示 Job ID"></textarea><p class="muted">关闭页面前请复制或下载名单。</p></section>
</main><script type="module" src="/screening.js?v=target-roles-2"></script></body></html>
