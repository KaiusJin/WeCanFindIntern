name: Public job feed

# Parallel campaign (see cloud/parallel.py):
#   plan ─┬─ indeed ──────────────────────────────────────┐
#         └─ linkedin × search term ── linkedin-details ──┤
#   discover ─┬─ boards ──────────────────────────────────┼─ publish (dedupe, persist, R2 feed, ops report)
#             └─ workday × pod slice ─────────────────────┘
# Collector shards hold no secrets and each runs on its own egress IP, so
# LinkedIn and Workday rate limits apply per shard. LinkedIn shards drop IDs
# seen in the last 24 h; linkedin-details retries the JDs the shards could not
# fetch. A missing shard is a hard failure (red run); everything else is published.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
    inputs:
      validate_database_only:
        description: Check the Supabase connection, tables and permissions without collecting or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-job-feed
  cancel-in-progress: false

env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    if: ${{ inputs.validate_database_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - name: Validate Supabase database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          python - <<'PYTHON'
          import os
          import psycopg

          try:
              with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=20) as db:
                  db.execute("SET TRANSACTION READ ONLY")
                  db.execute("SET LOCAL statement_timeout = '30s'")
                  schema, create_ok, temp_ok = db.execute("""
                      SELECT current_schema(),
                             has_schema_privilege('job_feed', 'USAGE, CREATE'),
                             has_database_privilege(current_database(), 'TEMP')
                  """).fetchone()
                  if schema != "job_feed" or not create_ok or not temp_ok:
                      raise RuntimeError("Expected job_feed search_path, schema USAGE/CREATE and database TEMP")
                  for name, allowed, owned in db.execute("""
                      SELECT c.relname,
                             has_table_privilege(c.oid, 'SELECT, INSERT, UPDATE, DELETE'),
                             pg_has_role(c.relowner, 'USAGE')
                      FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                      WHERE n.nspname='job_feed' AND c.relkind IN ('r','p')
                  """):
                      if not allowed or not owned:
                          raise RuntimeError(f"Missing table privileges or owner membership: {name}")
                  for name, allowed in db.execute("""
                      SELECT c.relname, has_sequence_privilege(c.oid, 'USAGE, SELECT')
                      FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                      WHERE n.nspname='job_feed' AND c.relkind='S'
                  """):
                      if not allowed:
                          raise RuntimeError(f"Missing sequence privileges: {name}")
                  db.execute("SELECT 1 FROM job_feed.jobs LIMIT 1")
              print("Supabase connection, tables and collector privileges verified (read only).")
          except psycopg.Error as exc:
              # Connection exceptions can contain DSN details; keep credentials out of logs.
              raise SystemExit(f"Database validation failed: {type(exc).__name__}; SQLSTATE={exc.sqlstate}") from None
          PYTHON

  plan:
    if: ${{ !inputs.validate_database_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      linkedin: ${{ steps.plan.outputs.linkedin }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - id: plan
        env:
          # Read-only: sweep window and fresh LinkedIn detail IDs.
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: python -m cloud.parallel plan work/plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: work/plan
          retention-days: 3
          if-no-files-found: error

  discover:
    if: ${{ !inputs.validate_database_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      workday: ${{ steps.discover.outputs.workday }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - id: discover
        run: python -m cloud.parallel discover work/discover
      - uses: actions/upload-artifact@v4
        with:
          name: discover
          path: work/discover
          retention-days: 3
          if-no-files-found: error

  indeed:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - run: python -m cloud.parallel collect indeed --plan work/plan out
      - uses: actions/upload-artifact@v4
        with:
          name: out-indeed
          path: out
          retention-days: 3
          if-no-files-found: error

  linkedin:
    name: linkedin ${{ matrix.shard }}
    needs: plan
    if: ${{ needs.plan.outputs.linkedin != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linkedin) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - run: python -m cloud.parallel collect linkedin ${{ matrix.shard }} --plan work/plan out
      - uses: actions/upload-artifact@v4
        with:
          name: out-linkedin-${{ matrix.shard }}
          path: out
          retention-days: 3
          if-no-files-found: error

  linkedin-details:
    # Retry the JD of every LinkedIn job a shard returned without one.
    needs: [plan, linkedin]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.linkedin != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - uses: actions/download-artifact@v4
        # No LinkedIn shard artifact at all must not fail this step.
        continue-on-error: true
        with:
          pattern: out-linkedin-*
          path: inputs
      - run: mkdir -p inputs && python -m cloud.parallel collect linkedin-details --plan work/plan --inputs inputs out
      - uses: actions/upload-artifact@v4
        with:
          name: out-linkedin-details
          path: out
          retention-days: 3
          if-no-files-found: error

  boards:
    needs: [plan, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - uses: actions/download-artifact@v4
        with:
          name: discover
          path: work/discover
      - run: python -m cloud.parallel collect boards --plan work/plan --discover work/discover out
      - uses: actions/upload-artifact@v4
        with:
          name: out-boards
          path: out
          retention-days: 3
          if-no-files-found: error

  workday:
    name: workday ${{ matrix.shard }}
    needs: [plan, discover]
    if: ${{ needs.discover.outputs.workday != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.workday) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/plan
      - uses: actions/download-artifact@v4
        with:
          name: discover
          path: work/discover
      - run: python -m cloud.parallel collect workday ${{ matrix.shard }} --plan work/plan --discover work/discover out
      - uses: actions/upload-artifact@v4
        with:
          name: out-workday-${{ matrix.shard }}
          path: out
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [plan, discover, indeed, linkedin, linkedin-details, boards, workday]
    # Publish whatever was collected; missing shards are reported as failures.
    if: ${{ always() && !inputs.validate_database_only && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            cloud/requirements.txt
      - run: python -m pip install -r cloud/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Persist and publish
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DB_POOL_MAX_SIZE: '4'
          DB_STATEMENT_TIMEOUT_MS: '60000'
        # bash (not the default sh) gives pipefail, so a failed run still fails the step.
        shell: bash
        run: python -u -m cloud.run --from-artifacts artifacts 2>&1 | tee run.log
      - name: Upload run log for the ops page
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # DATABASE_URL is only listed so its value is redacted from the uploaded log.
        run: test -f run.log && python -m cloud.ops.report upload-log run.log || true
