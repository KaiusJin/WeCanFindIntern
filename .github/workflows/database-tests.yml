name: Database tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wecanfindintern
          POSTGRES_PASSWORD: wecanfindintern
          POSTGRES_DB: wecanfindintern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wecanfindintern -d wecanfindintern_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . 'pytest>=8,<9'
      - name: Database integration tests
        env:
          TEST_DATABASE_URL: postgresql://wecanfindintern:wecanfindintern@127.0.0.1:5432/wecanfindintern_test
        run: make test-db PYTHON=python
