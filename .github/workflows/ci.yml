name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry-core
          pip install -e ./vendor/JobSpy
          pip install -e .
          pip install pytest ruff
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: PYTHONPATH=src python -m pytest
      - name: Frontend syntax
        run: for f in web/modules/*.js; do node --check "$f"; done
      - name: Frontend/API contract
        run: PYTHONPATH=src python scripts/dev/verify_frontend_api_contract.py
