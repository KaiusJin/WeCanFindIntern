name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: windows-2022
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Verify release tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node -e "const expected = 'v' + require('./desktop/package.json').version;
          if (process.env.GITHUB_REF_NAME !== expected) {
            throw new Error('Release tag ' + process.env.GITHUB_REF_NAME +
            ' does not match desktop/package.json (' + expected + ')');
          }"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Build macOS PostgreSQL runtime
        if: runner.os == 'macOS'
        env:
          PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: scripts/desktop/build_postgres_macos.sh

      - name: Install PostgreSQL 16 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install postgresql16 --no-progress --yes --params '/Password:wecanfindintern-build-only'

      - name: Enable Visual Studio build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows PostgreSQL runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/desktop/build_postgres_windows.ps1 -Python "${{ env.pythonLocation }}\python.exe"

      - name: Build native Python sidecar
        run: python scripts/desktop/build_backend.py --clean

      - name: Build macOS desktop installers
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run make; then
              exit 0
            fi
            if (( attempt == 3 )); then
              exit 1
            fi
            echo "macOS packaging attempt $attempt failed; cleaning up before retry."
            hdiutil detach "/Volumes/WeCanFindIntern" -force 2>/dev/null || true
            sleep $((attempt * 5))
          done

      - name: Build Windows desktop installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: WeCanFindIntern-${{ matrix.artifact }}
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: WeCanFindIntern-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          duplicate_names="$(find . -type f -printf '%f\n' | sort | uniq -d)"
          if [[ -n "$duplicate_names" ]]; then
            echo "Release assets have duplicate filenames:" >&2
            echo "$duplicate_names" >&2
            exit 1
          fi
          while IFS= read -r -d '' asset; do
            hash="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$hash" "$(basename "$asset")"
          done < <(find . -type f -print0 | sort -z) > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to overwrite it." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "WeCanFindIntern $GITHUB_REF_NAME" \
              --generate-notes \
              --notes "Self-contained desktop builds for macOS and Windows. These artifacts are currently unsigned, so Gatekeeper or SmartScreen may show a warning." \
              --draft
          fi

          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
