name: Desktop release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos
          - os: windows-2022
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Build macOS PostgreSQL runtime
        if: runner.os == 'macOS'
        env:
          PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: scripts/desktop/build_postgres_macos.sh

      - name: Install PostgreSQL 16 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install postgresql16 --no-progress --yes --params '/Password:wecanfindintern-build-only'

      - name: Enable Visual Studio build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows PostgreSQL runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/desktop/build_postgres_windows.ps1 -Python "${{ env.pythonLocation }}\python.exe"

      - name: Build native Python sidecar
        run: python scripts/desktop/build_backend.py --clean

      - name: Build desktop installers
        working-directory: desktop
        run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: WeCanFindIntern-${{ matrix.artifact }}
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14
